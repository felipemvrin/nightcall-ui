<fieldset
  class="nc-radio"
  [disabled]="disabled()"
  [attr.aria-invalid]="error() ? 'true' : null"
  [attr.aria-describedby]="supportId()"
>
  @if (label()) {
    <legend class="nc-radio__legend">{{ label() }}</legend>
  }

  <div class="nc-radio__options">
    @for (option of options(); track option.value) {
      <label class="nc-radio__option">
        <input
          class="nc-radio__native"
          type="radio"
          [name]="groupName()"
          [value]="option.value"
          [checked]="value() === option.value"
          [disabled]="disabled() || !!option.disabled"
          (change)="onChange($event)"
        />

        <span class="nc-radio__control" aria-hidden="true">
          <span class="nc-radio__dot"></span>
        </span>

        <span class="nc-radio__text">{{ option.label }}</span>
      </label>
    }
  </div>
</fieldset>

@if (helperText()) {
  <p class="nc-radio__support" [attr.id]="supportId()">{{ helperText() }}</p>
}
