@if (label() || showPercentage()) {
<div class="nc-progress__meta">
    @if (label()) {
    <span class="nc-progress__label">{{ label() }}</span>
    }

    @if (showPercentage() && !indeterminate()) {
    <span class="nc-progress__value">{{ percentageLabel() }}</span>
    }
</div>
}

<div class="nc-progress" role="progressbar" [attr.aria-label]="label() ?? 'Progress'"
    [attr.aria-live]="indeterminate() ? null : 'polite'" [attr.aria-busy]="indeterminate() ? 'true' : null"
    [attr.aria-valuemin]="indeterminate() ? null : 0" [attr.aria-valuemax]="indeterminate() ? null : max()"
    [attr.aria-valuenow]="indeterminate() ? null : value()">
    <span class="nc-progress__bar" [style.inline-size]="progressStyle()?.inlineSize"></span>
</div>
