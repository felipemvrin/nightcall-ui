@if (label()) {
<label class="nc-select__label" [attr.for]="selectId()">{{ label() }}</label>
}

<div class="nc-select__control">
    <select class="nc-select__native" [id]="selectId()" [value]="value() ?? ''" [required]="required()"
        [disabled]="disabled()" [attr.aria-invalid]="isInvalid() ? 'true' : null" [attr.aria-describedby]="supportId()"
        (change)="onChange($event)">
        @if (placeholder()) {
        <option value="" [disabled]="required()" [selected]="!value()">{{ placeholder() }}</option>
        }

        @if (hasGroups()) {
        @for (group of groups(); track group.label) {
        <optgroup [label]="group.label">
            @for (option of group.options; track option.value) {
            <option [value]="option.value" [disabled]="option.disabled">{{ option.label }}</option>
            }
        </optgroup>
        }
        } @else {
        @for (option of options(); track option.value) {
        <option [value]="option.value" [disabled]="option.disabled">{{ option.label }}</option>
        }
        }
    </select>

    <span class="nc-select__chevron" aria-hidden="true">⌄</span>
</div>

@if (supportingText()) {
<p class="nc-select__support" [attr.id]="supportId()">{{ supportingText() }}</p>
}
