<main class="shell">
  <section class="hero">
    <h2 class="eyebrow">
      <nc-glitch-text
        class="uppercase font-[Oxanium] text-[var(--nc-color-primary)]"
        text="Design system"
      />
      ·
      <nc-glitch-text
        class="uppercase font-[Oxanium] text-[var(--nc-color-secondary)]"
        text="Angular"
        variant="neon"
      />
      ·
      <nc-glitch-text
        class="uppercase font-[Oxanium] text-[var(--nc-color-info)]"
        text="Storybook"
      />
    </h2>
    <h1 class="brand">
      <img
        ngSrc="/assets/brand/logo-nc-ui.svg"
        [alt]="title"
        width="570"
        height="95"
        class="brand-logo"
        priority
      />
    </h1>
    <p class="lead">{{ subtitle }}</p>
    <p class="lead">{{ description }}</p>

    <div class="actions">
      <nc-button variant="primary" [glowTrace]="true" (click)="openDocs()">
        Explore docs
      </nc-button>

      <nc-button variant="outline" [glowTrace]="true" (click)="openStorybook()">
        Open Storybook
      </nc-button>
    </div>
    <div class="nc-player">
      @defer (on viewport) {
        <nc-music-player-pattern
          trackTitle="Nightcall"
          artistName="Kavinsky"
          audioSrc="/assets/audio/kavinsky-song.mp3"
          eyebrow="Live pattern preview"
        ></nc-music-player-pattern>
      } @placeholder {
        <div class="nc-player__placeholder" aria-hidden="true"></div>
      }
    </div>
  </section>

  <section class="features" aria-label="Value propositions">
    @for (feature of features; track feature.title) {
      <article class="card">
        <h2>{{ feature.title }}</h2>
        <p>{{ feature.description }}</p>
      </article>
    }
  </section>
</main>
